name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"    # 每 6 小时检查一次
  workflow_dispatch:           # 支持手动触发

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/wyx2685/v2board.git || true

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Check for new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/master)
          UPSTREAM_SHORT=$(git rev-parse --short upstream/master)
          MERGE_BASE=$(git merge-base HEAD upstream/master)

          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$UPSTREAM_SHORT" >> "$GITHUB_OUTPUT"
          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"

          if [ "$MERGE_BASE" = "$UPSTREAM" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "✅ 已是最新，无需同步"
          else
            COMMIT_COUNT=$(git rev-list "$MERGE_BASE".."$UPSTREAM" --count)
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "🔄 上游有 $COMMIT_COUNT 个新提交待合并"
            echo ""
            echo "新提交列表："
            git log --oneline "$MERGE_BASE".."$UPSTREAM"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          if git merge upstream/master --no-edit -m "chore: merge upstream $(git rev-parse --short upstream/master)"; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "✅ 自动合并成功"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "⚠️ 合并冲突，将创建 PR"
            git merge --abort
          fi

      # composer.lock 由本 fork 维护，上游没有该文件（所以合并时永不冲突）。
      # 但上游一旦改动 composer.json，lock 就会过期，composer install 会硬失败
      # ("lock file is not up to date")，导致同步后的镜像构建全崩。这里自动补齐。
      - name: Refresh composer.lock if upstream changed composer.json
        if: steps.merge.outputs.result == 'success'
        env:
          BEFORE: ${{ steps.check.outputs.local }}
        run: |
          set -euo pipefail

          if git diff --quiet "$BEFORE" HEAD -- composer.json; then
            echo "✅ composer.json 未变动，composer.lock 无需重新生成"
            exit 0
          fi

          echo "⚠️ 上游改动了 composer.json，重新生成 composer.lock"
          # 用 composer:2 镜像跑，与 Dockerfile 构建阶段保持一致；依赖解析的目标 PHP
          # 版本由 composer.json 的 config.platform 锁定，与 runner 自带的 PHP 无关。
          docker run --rm -v "$PWD":/app -w /app composer:2 \
            update --no-install --no-interaction --no-audit --ignore-platform-req=ext-*
          sudo chown "$(id -u):$(id -g)" composer.lock

          if git diff --quiet -- composer.lock; then
            echo "ℹ️ composer.lock 无实际变化"
          else
            git add composer.lock
            git commit --amend --no-edit --no-verify
            echo "✅ composer.lock 已重新生成并并入本次合并提交"
          fi

      - name: Push merged changes
        if: steps.merge.outputs.result == 'success'
        run: git push origin master

      - name: Trigger Docker Build
        if: steps.merge.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Docker Image Build..."
          gh workflow run docker-build.yml -R ${{ github.repository }} --ref master

      - name: Create PR on conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本仓库是 wyx2685/v2board 的 fork。不显式指定仓库时，gh 会把 PR 的 base
          # 解析到上游父仓库，而 GITHUB_TOKEN 对上游无写权限（createPullRequest 403）。
          GH_REPO: ${{ github.repository }}
          UPSTREAM_SHORT: ${{ steps.check.outputs.upstream_short }}
          MERGE_BASE: ${{ steps.check.outputs.merge_base }}
          UPSTREAM: ${{ steps.check.outputs.upstream }}
        run: |
          set -euo pipefail

          # 分支名按上游 commit 固定，避免每 6 小时堆积一个新的时间戳分支
          BRANCH="sync-upstream/$UPSTREAM_SHORT"

          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "ℹ️ 已存在针对 $UPSTREAM_SHORT 的开放 PR，跳过"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git merge upstream/master --no-edit || true

          CONFLICTS=$(git diff --name-only --diff-filter=U)
          git add -A
          git commit -m "chore: merge upstream $UPSTREAM_SHORT (conflicts need manual resolve)" --no-verify
          git push --force-with-lease origin "$BRANCH"

          # 用文件传 body，避免 git log 输出里的反引号被 shell 当成命令替换
          {
            echo "## 上游同步"
            echo
            echo "上游有新提交需要合并，但存在冲突。**本 PR 的冲突文件里带有 \`<<<<<<<\` 冲突标记，必须先手动解决再合并。**"
            echo
            echo "**上游 commit:** \`$UPSTREAM_SHORT\`"
            echo
            echo "### 冲突文件"
            echo '```'
            echo "$CONFLICTS"
            echo '```'
            echo
            echo "### 新提交"
            echo '```'
            git log --oneline "$MERGE_BASE".."$UPSTREAM"
            echo '```'
            echo
            echo "### 解决方式"
            echo '```bash'
            echo "git fetch origin && git checkout $BRANCH"
            echo "# 编辑冲突文件，删除冲突标记"
            echo "git add -A && git commit --amend --no-edit && git push --force-with-lease"
            echo '```'
            echo
            echo "> 解决冲突后合并此 PR，会自动触发 Docker 镜像构建。"
          } > /tmp/pr-body.md

          gh pr create \
            --title "🔄 Sync upstream: $UPSTREAM_SHORT" \
            --body-file /tmp/pr-body.md \
            --base master \
            --head "$BRANCH"
