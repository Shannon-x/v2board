services:
  v2board:
    image: ghcr.io/shannon-x/v2board:bf40f5e
    container_name: v2board
    restart: unless-stopped
    ports:
      - "${V2BOARD_PORT:-7680}:80"
    volumes:
      - ./data:/var/www/v2board/data
      - v2board-logs:/var/www/v2board/storage/logs
      # 挂载运行时配置，便于无需重建镜像即可调整日志与健康检查策略
      - ./docker/nginx.conf:/etc/nginx/sites-available/default:ro
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/v2board.conf:ro
      - ./docker/logrotate.conf:/etc/logrotate.d/v2board:ro
      - ./docker/log-tail.sh:/usr/local/bin/log-tail.sh:ro
      # 信任代理，使 url() 在反代后生成正确的 https 公网地址
      - ./app/Http/Middleware/TrustProxies.php:/var/www/v2board/app/Http/Middleware/TrustProxies.php:ro
      # 支付服务修复：优先使用 app_url 拼接回调地址
      - ./app/Services/PaymentService.php:/var/www/v2board/app/Services/PaymentService.php:ro
      - ./app/Http/Controllers/V1/Admin/PaymentController.php:/var/www/v2board/app/Http/Controllers/V1/Admin/PaymentController.php:ro
      # ConfigController: SIGUSR1 graceful reload + 自动备份配置到 data 目录
      - ./app/Http/Controllers/V1/Admin/ConfigController.php:/var/www/v2board/app/Http/Controllers/V1/Admin/ConfigController.php:ro
      # v2board 运行时配置（可写，由后台保存生成，自动备份到 data 目录）
      - ./config-v2board.php:/var/www/v2board/config/v2board.php
      # Horizon 队列配置（确保 production 环境下也有 worker 处理队列）
      - ./config/horizon.php:/var/www/v2board/config/horizon.php:ro
      # Logo 尺寸约束：防止大图撑爆登录页
      - ./resources/views/admin.blade.php:/var/www/v2board/resources/views/admin.blade.php:ro
      - ./public/assets/admin/custom.css:/var/www/v2board/public/assets/admin/custom.css:ro
      - ./public/theme/default/dashboard.blade.php:/var/www/v2board/public/theme/default/dashboard.blade.php:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 可选：webman 每处理多少请求后重启（默认 100000，原为 6600 导致 2-5 分钟重启一次）
      - WEBMAN_MAX_REQUEST=${WEBMAN_MAX_REQUEST:-100000}
      # 是否把 Nginx 访问日志实时输出到 docker logs（默认 false，避免日志过大）
      - TAIL_ACCESS_LOG=${TAIL_ACCESS_LOG:-false}
    healthcheck:
      # 兼容旧/新镜像：优先 /healthz，回退 /monitor/api，避免 "/" 因 Host 校验返回 403
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/monitor/api >/dev/null 2>&1 || curl -fsS http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - v2board-network

volumes:
  v2board-logs:

networks:
  v2board-network:
    name: ${DOCKER_NETWORK:-1panel-network}
    external: true
