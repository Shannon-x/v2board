services:
  v2board:
    image: ghcr.io/shannon-x/v2board:latest
    container_name: v2board
    restart: unless-stopped
    ports:
      - "${V2BOARD_PORT:-7680}:80"
    volumes:
      - ./data:/var/www/v2board/data
      - v2board-logs:/var/www/v2board/storage/logs
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - v2board-network

volumes:
  v2board-logs:

networks:
  v2board-network:
    name: ${DOCKER_NETWORK:-1panel-network}
    external: true
