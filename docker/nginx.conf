server {
    listen 80 default_server;
    server_name _;
    root /var/www/v2board/public;
    index index.php;

    client_max_body_size 20m;

    access_log /var/www/v2board/storage/logs/nginx-access.log;
    error_log  /var/www/v2board/storage/logs/nginx-error.log warn;

    # 静态资源由 Nginx 直接返回
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 安全：禁止访问敏感文件
    location ~ /\.(ht|env|git) {
        deny all;
        return 404;
    }

    # 避免浏览器默认请求 favicon 产生无关 404 噪音
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Horizon 监控面板不走 Workerman（避免 403 触发前端登出）
    location /monitor/api {
        default_type application/json;
        return 200 '{"data":[]}';
    }

    # 容器健康检查（不依赖 APP_URL/Host 校验、数据库、Redis）
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # 动态请求反向代理到 Workerman
    location / {
        proxy_pass http://127.0.0.1:6600;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10;
        proxy_send_timeout    300;
        proxy_read_timeout    300;
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         4 32k;
    }
}
