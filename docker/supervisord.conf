[program:webman]
command=php -c /var/www/v2board/cli-php.ini /var/www/v2board/webman.php start
directory=/var/www/v2board
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/www/v2board/storage/logs/webman.log
stdout_logfile_maxbytes=0
stdout_logfile_backups=0

[program:horizon]
command=php /var/www/v2board/artisan horizon
directory=/var/www/v2board
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/v2board/storage/logs/horizon.log
stdout_logfile_maxbytes=0
stdout_logfile_backups=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:logrotate]
command=/bin/bash -c "while true; do /usr/sbin/logrotate -f /etc/logrotate.d/v2board; sleep 86400; done"
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:logtail]
command=/bin/bash /usr/local/bin/log-tail.sh
autostart=true
autorestart=true
startsecs=1
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/v2board/artisan schedule:work
directory=/var/www/v2board
user=www-data
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/var/www/v2board/storage/logs/scheduler.log
stdout_logfile_maxbytes=5M
stdout_logfile_backups=5
redirect_stderr=true
