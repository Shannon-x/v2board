[program:webman]
command=php -c /var/www/v2board/cli-php.ini /var/www/v2board/webman.php start
directory=/var/www/v2board
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/www/v2board/storage/logs/webman.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

[program:horizon]
command=php /var/www/v2board/artisan horizon
directory=/var/www/v2board
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/v2board/storage/logs/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/www/v2board/storage/logs/nginx-access.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile=/var/www/v2board/storage/logs/nginx-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:logrotate]
command=/bin/bash -c "while true; do /usr/sbin/logrotate -f /etc/logrotate.d/v2board; sleep 86400; done"
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
